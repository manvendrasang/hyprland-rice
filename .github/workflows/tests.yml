name: HyprX CI

on:
  push:
    branches:
      - master
      - dev

  pull_request:

  workflow_dispatch:

jobs:

  # Fast gate: ShellCheck only. This used to run the whole suite, making it a
  # near-duplicate of the `tests` job on a slower runner.
  lint:

    name: ShellCheck

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install ShellCheck

        run: |
          sudo apt update
          sudo apt install -y shellcheck

      - name: Lint

        run: |
          # shellcheck source=lib/logger.sh
          fail=0
          while IFS= read -r -d '' file; do
            if ! shellcheck -x -e SC1090,SC1091,SC2010,SC2015,SC2034,SC2086 "$file"; then
              echo "::error file=$file::ShellCheck findings"
              fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.sh' -print0)
          exit "$fail"

  # Full suite, on the distro HyprX targets. This is the job that can fail on
  # a broken hyprland.lua, unparseable JSON/JSONC, or unbalanced hyprlock
  # braces.
  tests:

    name: Test Suite

    runs-on: ubuntu-latest

    container:
      image: archlinux:base

    steps:

      - name: Install prerequisites

        run: |
          pacman -Sy --noconfirm git bash sudo shellcheck python

      - uses: actions/checkout@v4

      - name: Run Tests

        run: bash tests/run_tests.sh
