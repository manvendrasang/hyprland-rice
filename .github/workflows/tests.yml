name: HyprX CI

on:
  push:
    branches:
      - master
      - dev

  pull_request:

  workflow_dispatch:

jobs:

  lint:

    name: Lint

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install ShellCheck

        run: |
          sudo apt update
          sudo apt install -y shellcheck

      # tests/run_tests.sh also runs ShellCheck over the whole tree, so this
      # job is partly redundant with the `tests` job below. That is
      # intentional: it fails fast on style errors before the slower job.
      #
      # The suite skips its pacman/lscpu/lspci assertions when those tools
      # are absent, so ubuntu is a valid environment for it even though
      # HyprX itself only supports Arch.
      - name: Run Tests

        run: bash tests/run_tests.sh

  tests:

    name: Unit Tests

    runs-on: ubuntu-latest

    needs: lint

    container:
      image: archlinux:base

    steps:

      - name: Install prerequisites

        run: |
          pacman -Sy --noconfirm git bash sudo shellcheck

      - uses: actions/checkout@v4

      - name: Run Tests

        run: bash tests/run_tests.sh
