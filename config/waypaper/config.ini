[Settings]
language = en
folder = ~/Pictures/Wallpapers
backend = hyprpaper
monitors = All
fill = Fill
sort = name
color = #7dd3fc
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
show_path_in_tooltip = True
number_of_columns = 3
use_xdg_state = False
zen_mode = False
post_command = ~/.local/share/hyprx/scripts/apply-wallust-theme.sh "$wallpaper"
