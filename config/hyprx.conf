# HyprX Configuration
# This file controls the behavior of the hyprx CLI tool.

# Theme: the default theme to use (must exist in config/waybar/themes/)
THEME=default

# Installer settings
AUTO_CONFIRM=false
ENABLE_GPU_OFFLOAD=true
BACKUP_ON_DEPLOY=true

# Logging
LOG_LEVEL=info
LOG_FILE=~/.local/share/hyprx/hyprx-install.log

# Package manager preference: auto, pacman, yay, or paru
PACKAGE_MANAGER=auto
