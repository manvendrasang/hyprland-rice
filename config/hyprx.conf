# HyprX configuration. Parsed (not sourced) by lib/config.sh - keys must be
# prefixed with HYPRX_CONFIG_, or they leak into the global namespace and
# collide with runtime state. Legacy bare spellings still parse.
# Unknown keys are reported and ignored. See `hyprx config --help`.

# Theme: must exist in config/waybar/themes/
HYPRX_CONFIG_THEME=default

# Installer settings
HYPRX_CONFIG_AUTO_CONFIRM=false
HYPRX_CONFIG_ENABLE_GPU_OFFLOAD=true
HYPRX_CONFIG_BACKUP_ON_DEPLOY=true

# Logging: off, error, warn, info, debug
HYPRX_CONFIG_LOG_LEVEL=info

# Install failure log. Unset uses ${XDG_STATE_HOME:-~/.local/state}/hyprx/
#HYPRX_CONFIG_LOG_FILE=~/.local/state/hyprx/hyprx-install.log

# auto, pacman, yay, or paru
HYPRX_CONFIG_PACKAGE_MANAGER=auto
