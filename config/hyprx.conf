# HyprX Configuration
#
# Parsed (not sourced) by lib/config.sh. Every key must be prefixed with
# HYPRX_CONFIG_ - an unprefixed key used to leak into the global namespace
# and collide with runtime state. The legacy bare spellings (THEME=...,
# PACKAGE_MANAGER=...) are still accepted for backwards compatibility, but
# are rewritten prefixed on the next `hyprx config set`.
#
# Unknown keys are reported as a warning and ignored.

# Theme: the default theme to use (must exist in config/waybar/themes/)
HYPRX_CONFIG_THEME=default

# Installer settings
HYPRX_CONFIG_AUTO_CONFIRM=false
HYPRX_CONFIG_ENABLE_GPU_OFFLOAD=true
HYPRX_CONFIG_BACKUP_ON_DEPLOY=true

# Logging
HYPRX_CONFIG_LOG_LEVEL=info

# Install failure log. Leave unset to use the default,
# ${XDG_STATE_HOME:-~/.local/state}/hyprx/hyprx-install.log
#HYPRX_CONFIG_LOG_FILE=~/.local/state/hyprx/hyprx-install.log

# Package manager preference: auto, pacman, yay, or paru
HYPRX_CONFIG_PACKAGE_MANAGER=auto
