# Generated by wallust - do not hand-edit ~/.config/hypr/colors.conf,
# it's regenerated on every wallpaper change. Edit
# config/wallust/templates/hypr-colors.conf (this template) instead.
#
# hyprlock.conf sources this file (hyprlang's `source =` directive -
# the same mechanism used throughout the Hyprland ecosystem for
# splitting config into multiple files) and references these as
# whole-value substitutions only ($fg_90, not interpolated fragments
# inside a larger rgba(...) call) - the safer, more conservative
# pattern, since hyprlang variable substitution itself wasn't
# independently build-verified for this change (see the commit
# message). Every actual number below IS produced by wallust's own
# templating, which was verified via GTK's real CssProvider on the
# equivalent CSS templates in item #5.
