# HyprX dynamic theming. Triggered on any wallpaper change by
# config/waybar/scripts/wallust-hyprpaper-sync.sh; run by hand with:
#   wallust run /path/to/wallpaper.jpg
#
# Values below use wallust's Jinja2-style syntax ({{var}}, {{var | rgb}},
# {{var | strip}}) - see templates/ for examples. check_contrast keeps
# generated colors readable against the wallpaper.
#
# Color roles used across every template (keep consistent when adding one):
#   background   -> main/darkest panel background
#   color0       -> secondary/"alt" panel background
#   color8       -> subtle borders and dividers
#   foreground   -> primary text
#   color7       -> dimmer/secondary text
#   color12      -> primary accent (bright blue) - active border,
#                   rofi's accent, waybar/swaync's highlight color
#   color4       -> secondary/darker accent (rofi's accent-dark)
#   color1/2/3/5/6/11/13 -> red/green/yellow/pink/cyan/orange/purple,
#                   used only where waybar needs a distinct named hue

backend = "full"
check_contrast = true

[templates]

waybar.template = "waybar-colors.css"
waybar.target = "~/.config/waybar/styles/colors.css"

rofi.template = "rofi-colors.rasi"
rofi.target = "~/.config/rofi/colors.rasi"

swaync.template = "swaync-colors.css"
swaync.target = "~/.config/swaync/colors.css"

wlogout.template = "wlogout-colors.css"
wlogout.target = "~/.config/wlogout/colors.css"

hypr.template = "hypr-colors.lua"
hypr.target = "~/.config/hypr/colors.lua"

hyprlock.template = "hypr-colors.conf"
hyprlock.target = "~/.config/hypr/colors.conf"

gtk.template = "gtk-colors.css"
gtk.target = "~/.config/gtk-3.0/gtk.css"
