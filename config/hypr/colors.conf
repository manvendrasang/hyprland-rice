# Default color variables, used until the first `wallust run <wallpaper>`
# (or automatically, the first time you change your wallpaper via
# waypaper - see config/waypaper/config.ini's post_command). Once
# wallust has run, this file is regenerated from
# config/wallust/templates/hypr-colors.conf and should not be
# hand-edited - it will be overwritten on the next wallpaper change.
$fg_100 = rgba(205, 214, 244, 1.0)
$fg_90 = rgba(205, 214, 244, 0.9)
$fg_85 = rgba(205, 214, 244, 0.85)
$fg_75 = rgba(205, 214, 244, 0.75)
$fg_65 = rgba(205, 214, 244, 0.65)
$fg_55 = rgba(205, 214, 244, 0.55)
$fg_50 = rgba(205, 214, 244, 0.5)
$fg_opaque = rgb(205, 214, 244)
$panel_bg = rgba(30, 30, 40, 0.85)
$panel_border = rgba(150, 150, 180, 0.4)
$accent = rgba(137, 180, 250, 1.0)
