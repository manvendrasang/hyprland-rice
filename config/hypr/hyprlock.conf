# Colors are dynamically generated by wallust from your current
# wallpaper (see config/wallust/wallust.toml) and sourced from
# colors.conf via hyprlang's own `source =` directive - the same
# file-splitting mechanism used throughout the Hyprland ecosystem.
source = ~/.config/hypr/colors.conf

general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.65
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Day name, large and bold
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A')"
    color = $fg_100
    font_size = 64
    font_family = Caudex, sans-serif
    position = 0, 210
    halign = center
    valign = center
}

# Date (DD Mon)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%d %b')"
    color = $fg_90
    font_size = 22
    font_family = Caudex, sans-serif
    position = 0, 148
    halign = center
    valign = center
}

# Time, small, dashed either side
label {
    monitor =
    text = cmd[update:1000] echo "- $(date +'%H:%M') -"
    color = $fg_65
    font_size = 13
    font_family = Caudex, sans-serif
    position = 0, 118
    halign = center
    valign = center
}

# Circular avatar, ringed in the palette's accent color - a deliberate
# single bold highlight, the same visual idea as wlogout's reference
# theme using one strong accent color against an otherwise neutral
# panel. Place your own square photo at ~/.face - if it's missing,
# hyprlock just shows nothing here (no error).
image {
    monitor =
    path = ~/.face
    size = 76
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 40
    halign = center
    valign = center
}

# Username pill - decorative only. Unlocking your own already-logged-
# in session only needs the password, so this isn't a real input,
# just a label styled to look like one. Sharper corners and a more
# solid/opaque panel than before, matching wlogout's reference theme's
# blockier, less-translucent aesthetic.
shape {
    monitor =
    size = 260, 44
    color = $panel_bg
    rounding = 6
    border_size = 1
    border_color = $panel_border
    position = 0, -52
    halign = center
    valign = center
}
label {
    monitor =
    text =  $USER
    color = $fg_85
    font_size = 15
    font_family = Caudex, sans-serif
    position = 0, -52
    halign = center
    valign = center
}

# Password field - the real, functional input. Same panel treatment
# as the username pill above, for a matched pair.
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    outer_color = $panel_border
    inner_color = $panel_bg
    font_color = $fg_opaque
    fade_on_empty = true
    placeholder_text =  Password
    hide_input = false
    rounding = 6
    position = 0, -106
    halign = center
    valign = center
}

# NOTE: this file previously carried a bottom icon row of three `label` blocks
# with an EMPTY `text =` and a nerd-font family. They rendered nothing at all,
# and the comment above them claimed hyprlock widgets have "no confirmed
# click-to-launch support" - which is wrong; hyprlock labels do support
# onclick. Either way, three invisible widgets are not a feature, so they are
# gone. Use SUPER+SHIFT+L (wlogout) and SUPER+L (hyprlock) for the real
# actions.

# Now playing, bottom-left. Horizontal, not vertical along the edge
# like the wlogout reference image - hyprlock's label widget has no
# confirmed text-rotation support (only image/shape do).
label {
    monitor =
    text = cmd[update:2000] echo "$(playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo 'Not playing')"
    color = $fg_55
    font_size = 12
    font_family = Caudex, sans-serif
    position = 30, 30
    halign = left
    valign = bottom
}

# Uptime, bottom-right. Same horizontal-only limitation as above.
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p)"
    color = $fg_55
    font_size = 12
    font_family = Caudex, sans-serif
    position = -30, 30
    halign = right
    valign = bottom
}
