general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.65
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Day name, large and bold
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A')"
    color = rgba(230, 230, 240, 1.0)
    font_size = 64
    font_family = Caudex, JetBrainsMono Nerd Font
    position = 0, 210
    halign = center
    valign = center
}

# Date (DD Mon)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%d %b')"
    color = rgba(205, 214, 244, 0.9)
    font_size = 22
    font_family = Caudex, JetBrainsMono Nerd Font
    position = 0, 148
    halign = center
    valign = center
}

# Time, small, dashed either side
label {
    monitor =
    text = cmd[update:1000] echo "- $(date +'%H:%M') -"
    color = rgba(205, 214, 244, 0.65)
    font_size = 13
    font_family = Caudex, JetBrainsMono Nerd Font
    position = 0, 118
    halign = center
    valign = center
}

# Circular avatar. Place your own square photo at ~/.face - if it's
# missing, hyprlock just shows nothing here (no error).
image {
    monitor =
    path = ~/.face
    size = 76
    rounding = -1
    border_size = 2
    border_color = rgba(205, 214, 244, 0.5)
    position = 0, 40
    halign = center
    valign = center
}

# Username pill - decorative only. Unlocking your own already-logged-
# in session only needs the password, so this isn't a real input,
# just a label styled to look like one (matching the reference image).
shape {
    monitor =
    size = 260, 44
    color = rgba(30, 30, 40, 0.7)
    rounding = 22
    border_size = 1
    border_color = rgba(150, 150, 180, 0.25)
    position = 0, -52
    halign = center
    valign = center
}
label {
    monitor =
    text =  $USER
    color = rgba(205, 214, 244, 0.85)
    font_size = 15
    font_family = Caudex, JetBrainsMono Nerd Font
    position = 0, -52
    halign = center
    valign = center
}

# Password field - the real, functional input
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(150, 150, 180, 0.25)
    inner_color = rgba(30, 30, 40, 0.7)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text =  Password
    hide_input = false
    rounding = 22
    position = 0, -106
    halign = center
    valign = center
}

# Bottom icon row (DND / restart / shutdown at a glance). These are
# purely decorative - hyprlock's widgets have no confirmed click-to-
# launch support, so they're not real buttons. Use the SUPER+SHIFT+L
# (wlogout) / SUPER+L (hyprlock) keybinds for the actual actions.
label {
    monitor =
    text = 
    color = rgba(205, 214, 244, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -40, -173
    halign = center
    valign = center
}
label {
    monitor =
    text = 
    color = rgba(205, 214, 244, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -173
    halign = center
    valign = center
}
label {
    monitor =
    text = 
    color = rgba(205, 214, 244, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 40, -173
    halign = center
    valign = center
}

# Now playing, bottom-left. Horizontal, not vertical along the edge
# like the reference image - hyprlock's label widget has no confirmed
# text-rotation support (only image/shape do).
label {
    monitor =
    text = cmd[update:2000] echo "$(playerctl metadata --format '{{artist}} - {{title}}' 2>/dev/null || echo 'Not playing')"
    color = rgba(205, 214, 244, 0.55)
    font_size = 12
    font_family = Caudex, JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

# Uptime, bottom-right. Same horizontal-only limitation as above.
label {
    monitor =
    text = cmd[update:60000] echo "$(uptime -p)"
    color = rgba(205, 214, 244, 0.55)
    font_size = 12
    font_family = Caudex, JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}
