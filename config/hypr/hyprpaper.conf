# hyprpaper is started by config/hypr/hyprland.lua; the wallpaper itself is
# applied at login by scripts/wallpaper-restore.sh over hyprpaper's IPC.
#
# There is deliberately NO `wallpaper { ... }` block here. One pinned a
# machine-specific absolute path that did not exist, so hyprpaper started with
# nothing ("Monitor has no target: no wp will be created") - and since it was
# committed, every `hyprx install` re-deployed the same broken path.
#
# sync-hyprpaper-conf.sh keeps this file pointing at whatever is actually live.
# To pin one wallpaper, uncomment a block and point it at a path that exists on
# this machine.

ipc = true
