# Binary → providing package manifest
#
# WHY THIS FILE EXISTS
# --------------------
# HyprX ships a closed package list and a config layer that invokes binaries by
# name. Nothing connected the two, so seven binaries were referenced by the
# config and installed by nothing. Every one of them failed silently:
#
#   hyprpaper       the ENTIRE wallpaper and dynamic-theming chain. Autostarted,
#                   configured, polled every 2s, restored at login - and absent
#                   from packages.list. A clean install had no wallpaper and no
#                   dynamic colours while the README called wallpaper theming a
#                   headline feature.
#   notify-send     libnotify. Used as the error handler in six scripts
#                   (sound-manager, wifi-manager, system-monitor,
#                   clipboard-clear, settings-menu, power-profile-cycle) plus
#                   wlogout/layout. Each one degrades to a silent no-op - the
#                   exact failure those scripts exist to prevent.
#   hostname        inetutils. failure_logger.sh:19, while logging a failure.
#   blueman-manager bluem.      config.jsonc:112 and settings-menu.sh:24.
#   nemo            the file manager bound in apps.lua. Same name as its
#                   package, so no table row needed - listed here so the
#                   removal of thunar stays explained.
#   rsync           scripts/dev-sync.sh:11.
#   fc-cache        fontconfig. lib/installer/fonts.sh installs Caudex and then
#                   relies on it to make the font visible.
#
# `hyprx doctor --only manifest` checks BOTH directions:
#   1. every provider named here is actually in packages.list
#   2. every command referenced by config/ and scripts/ is either declared here
#      or already installed
#
# Adding a line here is cheap and the doctor will hold you to it. Only include
# pairs where the binary name and the package name differ, or where the need is
# otherwise non-obvious - `waybar` in packages.list obviously provides `waybar`.

# --- the seven above --------------------------------------------------------
hyprpaper       | hyprpaper       | wallpaper + the whole dynamic-theming chain
notify-send     | libnotify       | error handler in 6 scripts + wlogout/layout
hostname        | inetutils       | failure_logger.sh:19
blueman-manager | blueman         | bluetooth GUI (waybar tray click, settings-menu); scripts fall back to bluetoothctl
mission-center  | mission-center  | system monitor GUI (cpu/memory widget clicks, settings-menu)
missioncenter   | mission-center  | alternate spelling the launcher wrapper also tries
fc-cache        | fontconfig      | fonts.sh installs Caudex, then needs the cache rebuilt
fc-match        | fontconfig      | doctor --only fonts proves Caudex resolves
brave           | brave-bin       | default browser bound in apps.lua (SUPER+B)

# Dropped from this list rather than declared:
#
#   thunar  was in packages.list and bound nowhere once the bind moved to
#           nemo. Removed from packages.list with it.
#   rsync   only used by scripts/dev-sync.sh, a dead helper whose --delete
#           destroyed the live hyprpaper.conf. The script is gone.

# --- hybrid graphics --------------------------------------------------------
supergfxctl     | supergfxctl     | doctor --only gpu
supergfxd       | supergfxctl     | the unit, enabled by services.list
asusctl         | asusctl         | power-profile-cycle.sh
